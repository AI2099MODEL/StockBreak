name: Build StockBreak AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing key
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -n "$UPLOAD_KEYSTORE_BASE64" ]]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=upload-key" >> "$GITHUB_ENV"
          else
            base64 --decode debug.keystore.base64 > "$GITHUB_WORKSPACE/debug.keystore"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
          fi

      - name: Build release AAB
        run: gradle --no-daemon clean bundleRelease

      - name: Verify AAB
        shell: bash
        run: |
          ls -lh app/build/outputs/bundle/release/
          echo "Signing mode: $SIGNING_MODE"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockBreak-9.0-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
